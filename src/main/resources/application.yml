server:
  port: 8090
  servlet:
    context-path: /api
spring:
  profiles:
    active: local
  application:
    name: ai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mp
    username: root
    password: 123456
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.al.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
